schema: spec-driven

context: |
  OpenDayCare es un prototipo de una plataforma para gestionar una guardería
  infantil ficticia. Su objetivo es facilitar la operación diaria del personal
  y la comunicación con las familias mediante autenticación, perfiles de niños,
  publicaciones, comentarios, invitaciones de padres y feeds diferenciados por
  rol.

  El proyecto también sirve como laboratorio de desarrollo asistido por agentes,
  MCPs y Spec Driven Development. Las propuestas, diseños, especificaciones y
  tareas de OpenSpec deben estar escritas en español y priorizar una solución
  segura, mantenible y adecuada para una aplicación multi-tenant con persistencia
  PostgreSQL.

